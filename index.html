<script>
(function(){
  const dust = document.getElementById('dust');
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.bottom = (Math.random()*20-10)+'%';
    s.style.animationDuration = (8+Math.random()*10)+'s';
    s.style.animationDelay = (Math.random()*10)+'s';
    dust.appendChild(s);
  }
})();

const lines = ['l1','l2','l3'];
lines.forEach((id,i)=>{
  setTimeout(()=>{ document.getElementById(id).classList.add('show'); }, 450*(i+1));
});
setTimeout(()=>{ document.getElementById('enter-btn').classList.add('show'); }, 450*(lines.length+1));

// Updated playlist with copyright-free Hindi audio assets & custom synth scales (Bhairavi & Raag modes)
const SONGS = [
  { 
    title: "Raag Bhairavi Synth",   
    artist: "Copyright Free / NCS", 
    year: "2021", 
    src: "https://upload.wikimedia.org/wikipedia/commons/2/23/Sitar_sound_sample.ogg", 
    scale: [0, 1, 3, 5, 7, 8, 10], // Bhairavi Thaat
    tempo: 130, 
    wave: 'sawtooth'   
  },
  { 
    title: "Desi Cyber Beats",     
    artist: "Royalty Free Audio", 
    year: "2022", 
    src: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Sitar_and_tabla.ogg", 
    scale: [0, 2, 4, 6, 7, 9, 11], // Yaman Thaat
    tempo: 124, 
    wave: 'triangle' 
  },
  { 
    title: "Midnight Mirage", 
    artist: "NCS Desi Chill", 
    year: "2020", 
    src: "", 
    scale: [0, 1, 4, 5, 7, 8, 11], // Bhairav Mode
    tempo: 110, 
    wave: 'sine' 
  },
  { 
    title: "Neon Shehnai Drift",     
    artist: "Free Synth India", 
    year: "2023", 
    src: "", 
    scale: [0, 2, 3, 5, 7, 8, 10], // Kafi Mode
    tempo: 140, 
    wave: 'square'
  }
];

let audioEl = null;
let actx = null, synthTimer = null, masterGain = null;
let currentIdx = -1;
let muted = false;

function stopAll(){
  if(audioEl){ audioEl.pause(); audioEl = null; }
  if(synthTimer){ clearInterval(synthTimer); synthTimer = null; }
}

function playSynthTrack(song){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  masterGain = actx.createGain();
  masterGain.gain.value = parseFloat(document.getElementById('vol').value) * (muted?0:1);
  masterGain.connect(actx.destination);

  const root = 220;
  const stepMs = 60000 / song.tempo / 2;
  let step = 0;
  synthTimer = setInterval(()=>{
    const semitone = song.scale[Math.floor(Math.random()*song.scale.length)] + (step % 8 === 0 ? 12 : 0);
    const freq = root * Math.pow(2, semitone/12);
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = song.wave;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.28, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + stepMs/1000*0.9);
    osc.connect(g); g.connect(masterGain);
    osc.start();
    osc.stop(actx.currentTime + stepMs/1000);
    step++;
  }, stepMs);
}

function playTrack(idx){
  stopAll();
  currentIdx = idx;
  const song = SONGS[idx];
  document.getElementById('np-title').textContent = song.title;
  document.getElementById('np-artist').textContent = song.artist;
  document.getElementById('np-year').textContent = song.year;

  if(song.src){
    audioEl = new Audio(song.src);
    audioEl.loop = true;
    audioEl.volume = parseFloat(document.getElementById('vol').value) * (muted?0:1);
    audioEl.play().catch(()=>{ playSynthTrack(song); });
  } else {
    playSynthTrack(song);
  }
}

function shuffleTrack(){
  let idx;
  do { idx = Math.floor(Math.random()*SONGS.length); } while(idx === currentIdx && SONGS.length > 1);
  playTrack(idx);
}

document.getElementById('shuffle-btn').addEventListener('click', shuffleTrack);

document.getElementById('vol').addEventListener('input', (e)=>{
  const v = parseFloat(e.target.value) * (muted?0:1);
  if(audioEl) audioEl.volume = v;
  if(masterGain) masterGain.gain.value = v;
});

document.getElementById('mute-btn').addEventListener('click', (e)=>{
  muted = !muted;
  e.target.innerHTML = muted ? '&#128263;' : '&#128266;';
  const v = parseFloat(document.getElementById('vol').value) * (muted?0:1);
  if(audioEl) audioEl.volume = v;
  if(masterGain) masterGain.gain.value = v;
});

document.getElementById('setup-toggle').addEventListener('click', ()=>{
  document.getElementById('setup-panel').classList.toggle('show');
});

document.getElementById('enter-btn').addEventListener('click', ()=>{
  document.getElementById('boot').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('app').classList.add('show');
  }, 250);
  shuffleTrack();
  startPresence();
});

const sessionId = 'p_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
let presenceTimer, countTimer;

async function heartbeat(){
  try{
    await window.storage.set('presence:' + sessionId, String(Date.now()), true);
  }catch(err){ }
}

async function refreshCount(){
  try{
    const listResult = await window.storage.list('presence:', true);
    if(!listResult || !listResult.keys){ return; }
    const now = Date.now();
    let active = 0;
    await Promise.all(listResult.keys.map(async (k)=>{
      try{
        const r = await window.storage.get(k, true);
        if(r && now - parseInt(r.value, 10) < 20000) active++;
      }catch(e){ }
    }));
    document.getElementById('online-count').textContent = Math.max(active, 1);
  }catch(err){
    document.getElementById('online-count').textContent = '1';
  }
}

function startPresence(){
  heartbeat();
  refreshCount();
  presenceTimer = setInterval(heartbeat, 5000);
  countTimer = setInterval(refreshCount, 6000);
}
</script>
